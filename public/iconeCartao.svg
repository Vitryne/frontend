<svg xmlns="http://www.w3.org/2000/svg" width="56" height="36" viewBox="0 0 56 36">
  <defs>
    <!-- Gradiente em 135 graus (linear-gradient(135deg, var(--ink), var(--plum))) -->
    <linearGradient id="card-gradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#181124"/>
      <stop offset="100%" stop-color="#3b114d"/>
    </linearGradient>

    <!-- Sombra projetada (box-shadow: rgba(74, 16, 99, 0.3) 0px 2px 6px) -->
    <filter id="card-shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#4a1063" flood-opacity="0.3"/>
    </filter>
  </defs>

  <!-- Corpo do Cartão -->
  <rect 
    x="0" 
    y="0" 
    width="56" 
    height="36" 
    rx="8" 
    ry="8" 
    fill="url(#card-gradient)" 
    filter="url(#card-shadow)"
  />

  <!-- Chip Dourado -->
  <rect 
    x="7" 
    y="6" 
    width="10" 
    height="7.5" 
    rx="2" 
    ry="2" 
    fill="#d1b26f"
  />

  <!-- Texto VISA -->
  <text 
    x="47" 
    y="28" 
    font-family="Arial, Helvetica, sans-serif" 
    font-size="10.5" 
    font-weight="bold" 
    font-style="italic" 
    fill="#ffffff" 
    text-anchor="end" 
    letter-spacing="0.5"
  >VISA</text>
</svg>
